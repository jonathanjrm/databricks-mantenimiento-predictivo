resources:
  pipelines:
    maintenance_pipeline:
      name: maintenance_pipeline_${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true          # Free Edition: serverless only
      continuous: false         # triggered: started from the job (one active pipeline per type)
      channel: CURRENT
      libraries:
        - glob:
            include: ../src/pipeline/**
      configuration:
        maintenance.raw_path: /Volumes/${var.catalog}/${var.schema}/raw/cmapss
        maintenance.src_root: /Volumes/${var.catalog}/${var.schema}/code   # see the I/O workaround in the README
