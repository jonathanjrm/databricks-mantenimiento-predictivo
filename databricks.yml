# Declarative Automation Bundle (formerly Databricks Asset Bundles).
# Deploy:  databricks bundle validate -t dev && databricks bundle deploy -t dev
# The workspace host is NOT written here: use a CLI profile or DATABRICKS_HOST.
bundle:
  name: predictive-maintenance

include:
  - resources/pipelines.yml
  - resources/jobs.yml
  - resources/app.yml
  # The serving endpoint needs an existing model version (created by the training job).
  # Comment out the next line on the first deployment; see README, "Run order".
  - resources/serving.yml

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition already has `workspace`)
    default: workspace
  schema:
    description: Project schema
    default: maintenance
  warehouse_id:
    description: ID of the 2X-Small SQL warehouse (Compute > SQL warehouses > Connection details)
    default: ""
  model_version:
    description: Version of rul_model served by the endpoint (entity_version does not accept an alias)
    default: "1"
  serverless_env_version:
    description: Serverless environment version of the jobs (check the docs for the latest available)
    default: "6"

targets:
  dev:
    mode: development     # prefixes resources with [dev user] and pauses schedules
    default: true

  prod:
    mode: production      # requires the main branch; Free Edition has no account-level service principals
    git:
      branch: main
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
