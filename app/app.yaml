# Databricks App configuration. Resources (SQL warehouse) are declared in the bundle
# (resources/app.yml) and referenced here by key with valueFrom.
command:
  - uvicorn
  - app:app
  - --host
  - 0.0.0.0
  - --port
  - $DATABRICKS_APP_PORT

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql_warehouse        # resource key in the bundle; resolves to the warehouse ID
  - name: CATALOG
    value: workspace                # must match the bundle variable `catalog`
  - name: SCHEMA
    value: maintenance              # must match the bundle variable `schema`
  - name: AI_SEARCH_INDEX
    value: workspace.maintenance.manual_chunks_index
  # Chat endpoint of Foundation Model APIs. Hosted models change and get retired:
  # check the Serving tab of the workspace.
  - name: LLM_ENDPOINT
    value: databricks-gpt-oss-120b
