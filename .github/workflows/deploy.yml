name: bundle-ci

# PR: validates the bundle and runs the tests. Push to main: deploys to dev.
# OAuth M2M authentication with a service principal. Repository secrets:
#   DATABRICKS_HOST, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET
# No token is ever stored in the repository.
#
# Databricks secrets are injected ONLY into the jobs that talk to the workspace
# (validate, deploy-dev). The `test` job installs dependencies and runs code from the PR,
# so it must not receive credentials (finding D-01 in audit/04_SECURITY_QA.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # No access to secrets: unit tests with local data only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # -rs makes skips visible (e.g. the Spark equivalence test when Java is missing).
      - run: python -m pytest -q -rs

  validate:
    needs: test
    if: github.event_name == 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Pinned to a published CLI release's commit SHA; check databricks/setup-cli for newer tags.
      - uses: databricks/setup-cli@b77668807bef70152b5cf3dfa49a6f624e61c7b4 # v0.280.0
      - run: databricks bundle validate -t dev

  deploy-dev:
    needs: test
    # Runs only once Databricks credentials are configured (repository variable DEPLOY_ENABLED=true).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Protected environment: configure a manual approval rule for "dev" in GitHub.
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: databricks/setup-cli@b77668807bef70152b5cf3dfa49a6f624e61c7b4 # v0.280.0
      - run: databricks bundle validate -t dev
      - run: databricks bundle deploy -t dev
